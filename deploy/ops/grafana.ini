# Grafana 主配置（WORK-028）。
#
# **只绑回环**：Grafana 的唯一入口是应用上 `hasRole("ADMIN")` 的反代路径
# `/api/v1/ops/grafana/**`。因此这里可以开匿名 Viewer——能到这条路径的人已经过管理员鉴权，
# 面板里不该再出现第二次登录。真正拦住外部访问的是"不监听公网"这件事本身。
[paths]
# **必须显式写**：不写时 Grafana 会去 <homepath>/data 建 sqlite，而 /usr 在
# ProtectSystem=strict 下是只读的，启动直接报 "read-only file system"（这里踩过）。
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000
# 反向代理会带来子路径前缀，Grafana 必须知道自己的根在哪，否则静态资源与 API 路径全错
root_url = http://127.0.0.1:3000/api/v1/ops/grafana/
serve_from_sub_path = true
# 管理端用同源 iframe 嵌入
allow_embedding = true

[security]
# 匿名可以看；能改的只有 Admin 账号（口令在 /etc/grafana/grafana.env，600）
anonymous_enabled = true
anonymous_org_name = Main Org.
anonymous_org_role = Viewer
cookie_secure = false
disable_initial_admin_creation = false

[users]
allow_sign_up = false
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console
level = info
